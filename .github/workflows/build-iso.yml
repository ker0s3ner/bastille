name: Build Bastille ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            bash \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            git \
            ca-certificates

      - name: Build ISO
        shell: bash
        run: bash build.sh 2>&1 | tee /tmp/bastille-build.log || { tail -20 /tmp/bastille-build.log; exit 1; }

      - name: Check ISO exists
        run: |
          find . -name "*.iso" -o -name "*.img" 2>/dev/null | head -20
          ls -lh build/live-image-amd64.hybrid.iso
          sha256sum build/live-image-amd64.hybrid.iso > bastille.iso.sha256
          cat bastille.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: bastille-iso
          path: |
            build/live-image-amd64.hybrid.iso
            bastille.iso.sha256
          retention-days: 7

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/bastille-build.log
          retention-days: 3

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}-amd64
          name: Bastille ${{ github.run_number }} (x86_64)
          body: |
            Automated build from commit ${{ github.sha }}.

            **Architecture:** x86_64 (amd64)
            **Base:** Debian Bookworm live
          draft: false
          files: |
            build/live-image-amd64.hybrid.iso
            bastille.iso.sha256
