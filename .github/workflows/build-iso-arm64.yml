name: Build Bastille ISO (ARM64)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            bash \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-efi-arm64-bin \
            mtools \
            dosfstools \
            git \
            ca-certificates

      - name: Patch config for arm64
        run: |
          sed -i 's/--architectures amd64/--architectures arm64/' build/auto/config
          # Remove x86-only packages that have no ARM64 equivalent
          sed -i '/xserver-xorg-video-intel/d' build/config/package-lists/thl-base.list.chroot
          sed -i '/intel-microcode/d'          build/config/package-lists/thl-base.list.chroot
          sed -i '/msr-tools/d'                build/config/package-lists/thl-base.list.chroot
          sed -i '/dmidecode/d'                build/config/package-lists/thl-base.list.chroot
          sed -i '/flashrom/d'                 build/config/package-lists/thl-base.list.chroot
          sed -i '/torbrowser-launcher/d'     build/config/package-lists/thl-base.list.chroot

      - name: Build ISO
        shell: bash
        run: bash build.sh 2>&1 | tee /tmp/bastille-build.log || { tail -20 /tmp/bastille-build.log; exit 1; }

      - name: Check ISO exists
        run: |
          find . -name "*.iso" -o -name "*.img" 2>/dev/null | head -20
          ls -lh build/live-image-arm64.hybrid.iso
          sha256sum build/live-image-arm64.hybrid.iso > bastille-arm64.iso.sha256
          cat bastille-arm64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: bastille-iso-arm64
          path: |
            build/live-image-arm64.hybrid.iso
            bastille-arm64.iso.sha256
          retention-days: 7

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm64
          path: /tmp/bastille-build.log
          retention-days: 3

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}-arm64
          name: Bastille ${{ github.run_number }} (ARM64)
          body: |
            Automated build from commit ${{ github.sha }}.

            **Architecture:** ARM64 (Apple Silicon, Raspberry Pi 4+)
            **Base:** Debian Bookworm live
          draft: false
          files: |
            build/live-image-arm64.hybrid.iso
            bastille-arm64.iso.sha256
