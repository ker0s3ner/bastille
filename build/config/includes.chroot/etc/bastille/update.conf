# Bastille OS — update configuration
# Loaded by bastille-update

BASTILLE_GITHUB_REPO="ker0s3ner/bastille"
BASTILLE_RELEASE_API="https://api.github.com/repos/${BASTILLE_GITHUB_REPO}/releases/latest"

# Which squashfs asset names to fetch (patterns matched against release asset names)
BASTILLE_SQUASHFS_ASSET_AMD64="bastille-live-amd64.squashfs"
BASTILLE_SQUASHFS_ASSET_ARM64="bastille-live-arm64.squashfs"
# Architecture-specific SHA256SUMS files published by each CI workflow
BASTILLE_SHA256SUMS_ASSET_AMD64="SHA256SUMS-amd64"
BASTILLE_SHA256SUMS_ASSET_ARM64="SHA256SUMS-arm64"

# Version file written to the squashfs (read at runtime to show current version)
BASTILLE_VERSION_FILE="/etc/bastille/version"

# Boot partition mount point (where the squashfs lives on the live medium)
# live-boot mounts the boot medium at /run/live/medium
BASTILLE_BOOT_MEDIUM="/run/live/medium"
BASTILLE_SQUASHFS_PATH="live/filesystem.squashfs"

# Download temp directory
BASTILLE_DOWNLOAD_DIR="/var/cache/bastille-update"

# Notify the desktop user of update state
BASTILLE_NOTIFY_USER="user"
