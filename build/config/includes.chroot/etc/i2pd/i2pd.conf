## i2pd configuration for THL
## i2pd is the C++ I2P router. All outbound traffic from THL can be
## optionally routed through I2P in addition to the WireGuard VPN.
##
## Architecture:
##   App → SOCKS5 (127.0.0.1:4447) → i2pd → I2P network
##   App → HTTP proxy (127.0.0.1:4444) → i2pd → I2P network
##
## The WireGuard VPN carries the I2P traffic itself, so the VPN provider
## only sees encrypted I2P traffic — they cannot see I2P destinations.

[general]
# Store router data here (survives reboots, but is not sensitive)
datadir = /var/lib/i2pd

# Disable UPnP — we control our own firewall
nat = true
upnp.enabled = false

# Log to syslog only — no logfile on disk
loglevel = warn
logfile = /dev/null
syslog = true

# IPv6 support (requires the VPN tunnel to support it)
ipv6 = false

# Bandwidth (kilobytes per second). L=32, O=256, P=2048, X=unlimited.
bandwidth = L

# How long to keep unused tunnels (seconds)
# Lower = faster detection of dead paths
inboundTunnelLifetime = 3600
outboundTunnelLifetime = 3600

# Number of tunnel hops (3 = standard I2P anonymity)
inboundTunnelLength = 3
outboundTunnelLength = 3

[httpproxy]
# HTTP proxy for I2P .i2p sites
enabled = true
address = 127.0.0.1
port = 4444

[socksproxy]
# SOCKS5 proxy — use this for I2P-aware apps
enabled = true
address = 127.0.0.1
port = 4447

[sam]
# SAM API for I2P-native applications (e.g. torrents)
enabled = true
address = 127.0.0.1
port = 7656

[bob]
enabled = false

[i2cp]
enabled = false

[websockets]
enabled = false

[web]
# Web console (accessible locally only for monitoring)
enabled = true
address = 127.0.0.1
port = 7070
