## i2pd tunnel configuration for THL
##
## No inbound tunnels by default (reduces attack surface and exposure).
## Add outbound tunnels here if you want to reach specific I2P services.
##
## Example — I2P IRC:
## [irc-ilita]
## type = client
## address = 127.0.0.1
## port = 6668
## destination = irc.ilita.i2p
## destinationport = 6667
## keys = irc-ilita.dat
