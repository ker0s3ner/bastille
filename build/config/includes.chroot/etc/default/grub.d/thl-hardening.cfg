# THL GRUB hardening — appended to /etc/default/grub at install time.
#
# These parameters require kernel support and take effect at boot — they
# cannot be set via sysctl after the kernel has started.

# ── Core AFU hardening ─────────────────────────────────────────────────────

# kernel lockdown=confidentiality:
#   - Disables /dev/mem and /proc/kcore (direct kernel memory access)
#   - Blocks kexec (replaces running kernel without reboot)
#   - Disables hibernation (would write RAM — including LUKS keys — to disk)
#   - Requires signed kernel modules (prevents loading attack tools as modules)
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX lockdown=confidentiality"

# ── IOMMU — prevents DMA attacks via Thunderbolt, PCIe, and similar ────────
#
# IOMMU restricts which physical memory addresses each PCIe device can
# access. Without IOMMU, a device (including an attacker's Thunderbolt
# gadget) can DMA-read any RAM address and extract LUKS keys.
# With IOMMU + force_isolation, each device can only access memory the
# kernel explicitly maps for it.
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX intel_iommu=on iommu=force amd_iommu=on"
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX iommu.passthrough=0 iommu.strict=1"

# ── Thunderbolt security level ─────────────────────────────────────────────
# "nopci" disables PCIe tunneling entirely (Thunderbolt becomes USB-C only).
# Use "user" if you need Thunderbolt docks; approve devices individually.
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX thunderbolt.dynpower=0"

# ── Spectre / Meltdown mitigations ────────────────────────────────────────
# Full mitigations prevent speculative-execution-based key extraction.
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX mitigations=auto,nosmt"
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX spectre_v2=on spec_store_bypass_disable=on"

# ── Memory scrubbing ───────────────────────────────────────────────────────
# Zero freed pages immediately so key material doesn't linger
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX init_on_alloc=1 init_on_free=1"

# ── Module signing ─────────────────────────────────────────────────────────
# Refuse unsigned or badly-signed modules (enforced by lockdown=confidentiality)
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX module.sig_enforce=1"

# ── Ring -1 (Hypervisor): disable kernel-side VMX/SVM use ─────────────────
# The KVM modules are blacklisted, but this parameter prevents the kernel
# itself from enabling VMX/SVM even if a module somehow loads.
# Note: this does NOT disable the CPU feature — do that in BIOS (VT-x/SVM).
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX kvm.enable_virt_at_load=0"

# ── Ring -2 (SMM): reduce SMI surface ─────────────────────────────────────
# Disable S3 sleep at the kernel level (also enforced via systemd sleep.conf).
# S3 requires extensive SMM involvement; use poweroff instead.
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX mem_sleep_default=s2idle"

# ── Quiet boot ─────────────────────────────────────────────────────────────
# Suppress kernel messages that might reveal hardware layout to an observer
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX quiet loglevel=0"
