# THL kernel module blacklist
# Blocks hardware attack vectors and unnecessary drivers.
#
# DMA attack prevention:
#   Thunderbolt and FireWire allow direct memory access — an attacker
#   can connect a device and read RAM including LUKS keys and the kernel
#   keyring before the OS can react. We disable these at the module level.
#   IOMMU (set via kernel cmdline) adds a second layer.
#
# To re-enable any module temporarily (e.g. for a Thunderbolt dock):
#   sudo modprobe <module>   (survives until reboot)

# ── DMA attack surfaces ────────────────────────────────────────────────────

# FireWire (IEEE 1394) — DMA attack vector since the early 2000s
blacklist firewire-core
blacklist firewire-ohci
blacklist firewire-sbp2

# Thunderbolt — DMA until kernel enforces IOMMU (and even then, partially)
# The kernel's thunderbolt security level is set to "user" via GRUB, but
# blacklisting ensures it never loads even if GRUB config is bypassed.
blacklist thunderbolt

# ── Rarely needed, high attack surface ────────────────────────────────────

# PCMCIA / ExpressCard — legacy DMA
blacklist pcmcia
blacklist yenta_socket

# USB storage — blocked via USBGuard rules (more granular), but also here
# to stop autoloading before USBGuard starts
# (leave commented — USB keyboards/mice need usb-storage for some hubs)
# blacklist usb-storage

# ── Wireless attack surfaces ───────────────────────────────────────────────

# Bluetooth — high-attack-surface wireless, not needed on THL
blacklist bluetooth
blacklist btusb
blacklist btrtl
blacklist btbcm
blacklist btintel
blacklist rfcomm
blacklist bnep

# ── Obscure filesystems ────────────────────────────────────────────────────
# These are rarely needed and have had exploitable vulnerabilities.

blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist hfs
blacklist hfsplus
# squashfs: NOT blacklisted — required to mount the live filesystem.
# blacklist squashfs
blacklist udf

# ── Webcam / microphone ────────────────────────────────────────────────────
# Uncomment to disable audio/video capture (defeats remote interception)
blacklist uvcvideo
# blacklist snd_usb_audio
