# THL kernel hardening — AFU anti-forensics and general hardening
# Applied at boot by systemd-sysctl.
#
# Reference: https://www.kernel.org/doc/html/latest/admin-guide/sysctl/
# Cellebrite threat model: attacker has physical access to a running, unlocked
# device and can attach tools via USB, Thunderbolt, or network.

# ── Memory protection ──────────────────────────────────────────────────────

# Restrict /proc/kcore (raw kernel memory) to root, then we further restrict
# via kernel.dmesg_restrict. Cellebrite tools running as root still cannot
# read logon keys from the kernel keyring.
kernel.kptr_restrict = 2

# Hide kernel addresses in /proc and sysfs from all users including root
kernel.dmesg_restrict = 1

# Restrict perf_events (used for side-channel attacks and memory reads)
kernel.perf_event_paranoid = 3

# Disable unprivileged eBPF — eBPF programs can read kernel memory
kernel.unprivileged_bpf_disabled = 1

# Prevent eBPF JIT spraying attacks
net.core.bpf_jit_harden = 2

# Disable user namespaces for unprivileged users (used in container escapes)
kernel.unprivileged_userns_clone = 0

# ── ASLR ───────────────────────────────────────────────────────────────────

# Maximum ASLR entropy
kernel.randomize_va_space = 2

# ── Core dumps ─────────────────────────────────────────────────────────────

# Disable core dumps — they can contain key material
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0

# ── ptrace hardening ───────────────────────────────────────────────────────

# Only allow ptrace on direct children (prevents memory-scraping tools)
kernel.yama.ptrace_scope = 2

# ── Filesystem hardening ───────────────────────────────────────────────────

# Prevent hardlink/symlink attacks
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Restrict /proc to the owning user
# (requires hidepid=2 mount option — set in /etc/fstab by thl)
# fs.proc_super.hidepid is set at mount time

# ── Network — disable what we don't use ────────────────────────────────────

# No IPv4 forwarding (we are not a router)
net.ipv4.ip_forward = 0

# Disable IPv4 source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Disable ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Enable reverse path filtering (anti-spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Log martian packets
net.ipv4.conf.all.log_martians = 1

# Disable IPv6 router advertisements and redirects
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Ignore ICMP broadcasts
net.ipv4.icmp_echo_ignore_broadcasts = 1

# TCP hardening
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1

# ── Kernel lockdown ────────────────────────────────────────────────────────

# Kernel lockdown mode: "confidentiality" blocks /dev/mem, /proc/kcore,
# module loading without valid signature, hibernation (which writes RAM to disk)
# Set via kernel cmdline: lockdown=confidentiality
# (Cannot be set via sysctl — handled in GRUB config)

# ── Swap / hibernation ─────────────────────────────────────────────────────

# Hibernation is disabled via lockdown=confidentiality (writes RAM to disk).
# Disable swap entirely — key material must never be written to disk unencrypted.
vm.swappiness = 0

# ── RAM minimization — least sensitive data in memory ──────────────────────

# Aggressively reclaim page cache when memory is needed.
# Keeps sensitive data from lingering in filesystem cache.
vm.vfs_cache_pressure = 200

# Drop dirty page writeback ASAP — don't let modified pages sit in RAM.
vm.dirty_ratio = 5
vm.dirty_background_ratio = 2
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 100

# Disable transparent hugepages — they increase the RSS footprint of
# processes unnecessarily and make memory layout more predictable.
# (Also set via kernel cmdline: transparent_hugepage=never)

# Restrict mmap so shared library mappings can't be placed at attacker-
# controlled addresses.
vm.mmap_min_addr = 65536

# Limit the size of the kernel's module text (reduces kernel attack surface).
# Already enforced by lockdown=confidentiality + module.sig_enforce=1.

# ── Process isolation ──────────────────────────────────────────────────────

# Restrict reading of /proc/<pid>/maps to the owning process and root.
kernel.maps_protect = 1
