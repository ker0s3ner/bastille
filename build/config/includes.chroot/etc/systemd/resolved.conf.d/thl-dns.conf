# THL DNS enforcement
# systemd-resolved is the sole DNS resolver on this system.
# All traffic to port 53 from any process other than resolved is
# dropped by nftables (see /etc/nftables/thl-killswitch.nft).
#
# Upstream DNS uses DNS-over-TLS so queries are encrypted in transit.
# The VPN provider's internal DNS is preferred (set by wg-quick via
# the DNS= line in /etc/wireguard/wg0.conf); the entries below are
# fallbacks used before the tunnel is up and for DNSSEC validation.
#
# To change the resolver, edit DNS= and FallbackDNS= here, then run:
#   systemctl restart systemd-resolved

[Resolve]
# Primary: Mullvad's DNS inside the WireGuard subnet (set by wg-quick)
# This line is a fallback for when the VPN is not yet up.
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
DNS=2620:fe::9#dns.quad9.net 2620:fe::fe:9#dns.quad9.net

FallbackDNS=9.9.9.11#dns11.quad9.net 149.112.112.11#dns11.quad9.net

# Require DoT — refuse plain UDP/TCP DNS even to the upstream
DNSOverTLS=yes

# Validate DNSSEC; set to "allow-downgrade" if you hit compatibility issues
DNSSEC=yes

# Do not read DNS from DHCP leases — we control DNS exclusively
UseDNSStubListener=yes

# Prevent per-link DNS from overriding global config
ReadEtcHosts=yes
