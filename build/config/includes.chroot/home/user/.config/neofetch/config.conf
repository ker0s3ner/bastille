# Bastille OS — neofetch config
# Uses the Tux-behind-bars logo.

# Logo
image_backend="ascii"
image_source="/etc/bastille/ascii.txt"

# Info shown next to the logo
print_info() {
    info title
    info underline

    info "OS"         distro
    info "Host"       model
    info "Kernel"     kernel
    info "Init"       rc_de
    info "Uptime"     uptime
    info "Packages"   packages
    info "Shell"      shell
    info "DE"         de
    info "WM"         wm
    info "Terminal"   term
    info "CPU"        cpu
    info "Memory"     memory

    info cols
}

# Colours
colors=(4 6 1 8 8 6)
bold=on
underline_enabled=on
underline_char=─
separator=":"

# Misc
os_arch=on
speed_type="bios_limit"
speed_shorthand=on
cpu_brand=off
cpu_speed=on
cpu_cores="logical"
cpu_temp=off
memory_percent=on
memory_unit="gib"

# Padding on the right side of the logo
gap=3
